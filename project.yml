name: ROBTrainingGames
options:
  bundleIdPrefix: com.orbitusrobotics
  deploymentTarget:
    iOS: "18.0"
    visionOS: "2.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 975CAGD5EW
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
schemes:
  ROBTrainingiOS:
    build:
      targets:
        ROBTrainingiOS: all
        ROBTrainingTests: [test]
    test:
      targets:
        - ROBTrainingTests
  ROBTrainingVision:
    build:
      targets:
        ROBTrainingVision: all
targets:
  ROBTrainingiOS:
    type: application
    platform: iOS
    sources: [Shared, iOS]
    resources: [Shared/Resources, iOS/Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbitusrobotics.ROBTraining
        PRODUCT_NAME: ROB Training
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
  ROBTrainingVision:
    type: application
    platform: visionOS
    sources: [Shared, visionOS]
    resources: [Shared/Resources, visionOS/Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbitusrobotics.ROBTraining.vision
        PRODUCT_NAME: ROB Training Vision
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: visionOS/Info.plist
  ROBTrainingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ROBTrainingiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbitusrobotics.ROBTrainingTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ROB Training.app/ROB Training"
        BUNDLE_LOADER: "$(TEST_HOST)"
